---
# Docker Installation - This task will install Docker and Docker Compose on the target system.
# It will also ensure that the Docker service is enabled and started and create any service accounts needed.

# --------------------- USER CREATION --------------------
# Create a user for docker creation and managment
- name: System Management | Create Docker Admin User
  ansible.builtin.user:
    name: "{{ docker_admin_user }}"
    comment: Docker Administration User
    shell: /bin/bash
    groups: sudo
    create_home: true
    state: present

# --------------------- INSTALL DOCKER DEPENDENCIES --------------------
- name: Install docker dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
    update_cache: true

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download docker gpg key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /tmp/docker.gpg
    mode: '0644'

- name: Remove existing docker apt keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    state: absent

- name: Dearmor docker gpg key into apt keyring
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.gpg
    creates: /etc/apt/keyrings/docker.gpg

- name: Set docker apt keyring file permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    mode: '0644'

- name: Remove temporary docker gpg download
  ansible.builtin.file:
    path: /tmp/docker.gpg
    state: absent

- name: Add docker repository
  ansible.builtin.apt_repository:
    filename: docker
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu
      {{
        'jammy' if ansible_distribution_release | lower == 'jammy' else
        'noble' if ansible_distribution_release | lower == 'noble' else
        'noble' if ansible_distribution_release | lower == 'resolute' else
        'noble'
      }} stable
    state: present

- name: Refresh apt package cache after adding Docker repository
  ansible.builtin.apt:
    update_cache: true

# --------------------- INSTALL DOCKER ---------------------
- name: Install docker engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    install_recommends: false
    update_cache: true

- name: Ensure docker service is enabled and started
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
