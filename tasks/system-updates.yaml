---
# System Updates - Refresh package metadata, install available updates, and reboot if required.

# =============================================================================================================
# Package Updates - Update all installed packages and capture the update output.
# =============================================================================================================
- name: Package | check for new packages & update as required
  ansible.builtin.apt:
    update_cache: true
    upgrade: true
  register: aptout

- name: Package | Show package update output
  ansible.builtin.debug:
    msg: "{{ aptout.stdout_lines }}"
  when: aptout.stdout_lines is defined

# =============================================================================================================
# Reboot Checks - Determine whether a reboot is required after applying updates.
# =============================================================================================================
- name: Reboot | Check if a reboot is required.
  ansible.builtin.stat:
    path: /var/run/reboot-required
    get_checksum: true
  register: reboot_required_file

# --------------------- REBOOT IF REQUIRED --------------------
- name: Reboot | Reboot if previous flag is true
  ansible.builtin.reboot:
    msg: "Reboot initiated by Ansible Patching Routines"
  when: reboot_required_file.stat.exists

# =============================================================================================================
# Cleanup - Remove unnecessary package dependencies after the update process.
# =============================================================================================================
- name: Package | Remove dependencies - apt
  ansible.builtin.apt:
    autoremove: true
