---
# System Configuration - Apply the standard operating system hardening and required base configuration.

# =============================================================================================================
# Base Packages - Install the base packages required for the lab environment.
# =============================================================================================================
- name: Install packages
  ansible.builtin.apt:
    name:
      - prometheus-node-exporter
      - zip
      - unzip
      - net-tools

# =============================================================================================================
# Timezone Configuration - Set the system timezone for the host.
# =============================================================================================================
- name: System Management | Configure the timezone
  community.general.timezone:
    name: 'Australia/Adelaide'

# =============================================================================================================
# SSH Configuration - Harden SSH access and apply the standard login restrictions for the lab.
# =============================================================================================================
- name: Services | Stop ssh Service
  ansible.builtin.service:
    name: ssh
    state: stopped

# Update sshd_config file with relevant settings
- name: Login Grace time
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#LoginGraceTime'
    line: 'LoginGraceTime 60m'

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#PermitRootLogin'
    line: 'PermitRootLogin no'

- name: Max Auth Retries
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#MaxAuthTries'
    line: 'MaxAuthTries 4'

- name: Permit Empty Password
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#PermitEmptyPasswords'
    line: 'PermitEmptyPasswords no'

- name: Disable SSH TCP Forwarding for security
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#AllowTcpForwarding'
    line: 'AllowTcpForwarding no'
  # Note: This prevents SSH port forwarding/tunneling (e.g., ssh -L, ssh -R)
  # Users will not be able to create SSH tunnels if this is set to 'no'

- name: X11Forwarding
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#X11Forwarding'
    line: 'X11Forwarding no'

- name: UseDNS
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#UseDNS'
    line: 'UseDNS no'

# Validate SSH configuration before restarting service
- name: Validate SSH configuration syntax
  ansible.builtin.command:
    cmd: sshd -t
  changed_when: false

# Start the SSH service
- name: Services | Start ssh Service
  ansible.builtin.service:
    name: ssh
    state: started
