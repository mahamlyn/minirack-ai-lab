---
# OpenWebUI - This task will install OpenWebUI on the target system.
# It will also ensure that the OpenWebUI service is enabled and started.

# =============================================================================================================
# Dependancies - Ensure that the necessary dependancies for OpenWebUI installation are met.
# =============================================================================================================

- name: Ensure Docker service is enabled and started
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# =============================================================================================================
# Environment Preparation - Configure the environment for OpenWebUI installation.
# =============================================================================================================

- name: Create Open WebUI project directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /data/projects/open-webui
    - /data/projects/open-webui/data

- name: Copy Open WebUI docker-compose file to project directory
  ansible.builtin.copy:
    src: ../config-files/open-webui/docker-compose.yaml
    dest: /data/projects/open-webui/docker-compose.yaml
    mode: '0644'
    owner: root
    group: root

# =============================================================================================================
# Compute & Storage Validation - Check that the target system has sufficient resources to run OpenWebUI.
# =============================================================================================================

- name: Check available disk space for Docker image extraction
  ansible.builtin.shell: |
    df -Pk /var/lib/docker 2>/dev/null || df -Pk / | awk 'NR>1 {print $4}'
  register: docker_free_space_kb
  changed_when: false

- name: Prune stale Docker data when storage is low
  ansible.builtin.command: docker system prune -af --volumes
  when: (docker_free_space_kb.stdout_lines | first | int) < 5000000
  register: docker_prune
  changed_when: docker_prune.rc == 0

- name: Re-check Docker storage space before pull
  ansible.builtin.shell: |
    df -Pk /var/lib/docker 2>/dev/null || df -Pk / | awk 'NR>1 {print $4}'
  register: docker_free_space_after_prune
  changed_when: false

- name: Ensure Docker has enough free space for image extraction
  ansible.builtin.assert:
    that:
      - (docker_free_space_after_prune.stdout_lines | first | int) >= 5000000
    fail_msg: >-
      Docker does not have enough free space for the Open WebUI image on {{ ansible_hostname }}.
      Free space is {{ (docker_free_space_after_prune.stdout_lines | first | int) // 1024 }} MB.
      Free at least 5 GB before re-running the deployment.

# =============================================================================================================
# Docker Compose - Use Docker Compose to deploy the OpenWebUI service.
# =============================================================================================================

- name: Start Open WebUI with Docker Compose
  ansible.builtin.command:
    chdir: /data/projects/open-webui
    cmd: docker compose up -d
  register: openwebui_compose
  changed_when: openwebui_compose.rc == 0

# =============================================================================================================
# Validation - Confirm that the OpenWebUI service is running and accessible.
# =============================================================================================================

- name: Wait for Open WebUI container to be running
  ansible.builtin.command:
    chdir: /data/projects/open-webui
    cmd: docker compose ps --format '{{.Service}} {{.State}}'
  register: compose_status
  until: compose_status.stdout is search('open-webui.*running')
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for Open WebUI HTTP endpoint to respond
  ansible.builtin.uri:
    url: http://127.0.0.1:3000
    method: GET
    status_code: 200
    return_content: false
  register: openwebui_http
  until: openwebui_http.status == 200
  retries: 30
  delay: 5
  changed_when: false
