---
# =============================================================================================================
# Ollama Pre-Requisites - Ensure that the necessary prerequisites for Ollama installation are met.
# =============================================================================================================

- name: Install curl prerequisite
  ansible.builtin.apt:
    name:
      - curl
    state: present
    update_cache: true

# =============================================================================================================
# Ollama Installation - Download and install the Ollama runtime from the official source.
# =============================================================================================================

- name: Download Ollama installation script from the controller
  ansible.builtin.get_url:
    url: https://ollama.com/install.sh
    dest: /tmp/install-ollama.sh
    mode: '0755'
  delegate_to: localhost
  run_once: true
  become: false

- name: Copy Ollama installation script to target host
  ansible.builtin.copy:
    src: /tmp/install-ollama.sh
    dest: /tmp/install-ollama.sh
    mode: '0755'

- name: Run Ollama installation script
  ansible.builtin.command:
    cmd: /tmp/install-ollama.sh
    creates: /usr/local/bin/ollama

- name: Create Ollama systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install Ollama systemd override
  ansible.builtin.template:
    src: ../config-files/ollama-systemd-override.conf
    dest: /etc/systemd/system/ollama.service.d/override.conf
    owner: root
    group: root
    mode: '0644'

- name: Reload systemd and restart Ollama service
  ansible.builtin.systemd:
    name: ollama
    state: restarted
    enabled: true
    daemon_reload: true

# =============================================================================================================
# Ollama Configuration - Configure Ollama to use the specified AI model and display the current configuration.
# =============================================================================================================

- name: Check installed Ollama models
  ansible.builtin.command:
    cmd: ollama list --quiet
  register: ollama_list
  changed_when: false
  failed_when: false

- name: Pull configured AI model
  ansible.builtin.command:
    cmd: "ollama pull {{ ollama_model }}"
  when: ollama_model not in ollama_list.stdout
  register: model_pull
  changed_when: model_pull.rc == 0
  failed_when: model_pull.rc != 0

# =============================================================================================================
# Ollama Debugging - Display the current Ollama configuration for verification.
# =============================================================================================================

- name: Show current Ollama configuration
  ansible.builtin.command:
    cmd: ollama config
  register: ollama_config
  changed_when: false
  failed_when: false

- name: Debug Ollama configuration
  ansible.builtin.debug:
    var: ollama_config.stdout
