---
# Ollama Installation - Install the Ollama runtime and ensure the service is active.

- name: Install curl prerequisite
  ansible.builtin.apt:
    name:
      - curl
    state: present
    update_cache: true

- name: Download Ollama installation script from the controller
  ansible.builtin.get_url:
    url: https://ollama.com/install.sh
    dest: /tmp/install-ollama.sh
    mode: '0755'
  delegate_to: localhost
  run_once: true
  become: false

- name: Copy Ollama installation script to target host
  ansible.builtin.copy:
    src: /tmp/install-ollama.sh
    dest: /tmp/install-ollama.sh
    mode: '0755'

- name: Run Ollama installation script
  ansible.builtin.command:
    cmd: /tmp/install-ollama.sh
    creates: /usr/local/bin/ollama

- name: Ensure Ollama service is enabled and started
  ansible.builtin.systemd:
    name: ollama
    state: started
    enabled: true
