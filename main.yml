# AI Lab Ansible Playbook - This playbook deploys Ollama and other AI tools to the specified hosts in the inventory.

# =============================================================================================================
# System Preparation - Prepare the base operating system and required system configuration.
# =============================================================================================================
- name: System Preparation
  hosts:
    - all
  gather_facts: true
  become: true
  become_method: ansible.builtin.sudo
  become_user: root
  vars_files:
    - ./config-files/config.yaml

  tasks:
    - name: System Preparation | Patch and update the system
      ansible.builtin.import_tasks: tasks/system-updates.yaml

    - name: System Preparation | Include system configuration tasks
      ansible.builtin.import_tasks: tasks/system-config.yaml

# =============================================================================================================
# Ollama Installation - Install the Ollama runtime and required model configuration for the AI core host.
# =============================================================================================================
- name: Ollama Installation
  hosts:
    - ai-core
  gather_facts: true
  become: true
  become_method: ansible.builtin.sudo
  become_user: root
  vars_files:
    - ./config-files/config.yaml

  tasks:
    - name: Ollama Installation | Include ollama installation tasks
      ansible.builtin.import_tasks: tasks/app-ollama.yaml

# =============================================================================================================
# Docker Installation - Install Docker and the required runtime components on the application hosts.
# =============================================================================================================
- name: Docker Installation
  hosts:
    - ai-web
    - ai-utility
  gather_facts: true
  become: true
  become_method: ansible.builtin.sudo
  become_user: root
  vars_files:
    - ./config-files/config.yaml

  tasks:
    - name: Docker Installation | Include docker installation tasks
      ansible.builtin.import_tasks: tasks/app-docker.yaml

# =============================================================================================================
# Open WebUI Installation - Deploy the Open WebUI application stack on the configured web host.
# =============================================================================================================
- name: Open WebUI Installation
  hosts:
    - ai-web
  gather_facts: true
  become: true
  become_method: ansible.builtin.sudo
  become_user: root
  vars_files:
    - ./config-files/config.yaml

  tasks:
    - name: Open WebUI Installation | Include openweb installation tasks
      ansible.builtin.import_tasks: tasks/app-openweb.yaml

    - name: Hermes Installation | Include hermes installation tasks
      ansible.builtin.import_tasks: tasks/app-hermes.yaml
