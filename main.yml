# AI Lab Ansible Playbook - This playbook deploys Ollama and other AI tools to the specified hosts in the inventory.

# =============================================================================================================
# Deployment Start - Log deployment initialization timestamp for tracking and auditing.
# =============================================================================================================
- name: Deployment Initialization
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Deployment Start | Log deployment start timestamp
      ansible.builtin.debug:
        msg: "🚀 AI Lab Deployment started at {{ ansible.date_time.iso8601_basic_short }} on {{ ansible.date_time.date }}"
      vars:
        ansible.date_time: "{{ ansible.date_time }}"

    - name: Deployment Start | Create deployment log file
      ansible.builtin.file:
        path: "/tmp/ai-lab-deployment-{{ ansible.date_time.iso8601_basic_short }}.log"
        state: touch
        mode: '0644'
      vars:
        ansible.date_time: "{{ ansible.date_time }}"

# =============================================================================================================
# System Preparation - Prepare the base operating system and required system configuration.
# =============================================================================================================
- name: System Preparation
  hosts:
    - all
  gather_facts: true
  become: true
  become_method: ansible.builtin.sudo
  become_user: root
  vars_files:
    - ./config-files/config.yaml

  tasks:
    - name: System Preparation | Patch and update the system
      ansible.builtin.import_tasks: tasks/system-updates.yaml

    - name: System Preparation | Include system configuration tasks
      ansible.builtin.import_tasks: tasks/system-config.yaml

# =============================================================================================================
# Ollama Installation - Install the Ollama runtime and required model configuration for the AI core host.
# =============================================================================================================
- name: Ollama Installation
  hosts:
    - ai-core
  gather_facts: true
  become: true
  become_method: ansible.builtin.sudo
  become_user: root
  vars_files:
    - ./config-files/config.yaml

  tasks:
    - name: Ollama Installation | Include ollama installation tasks
      ansible.builtin.import_tasks: tasks/app-ollama.yaml

# =============================================================================================================
# Docker Installation - Install Docker and the required runtime components on the application hosts.
# =============================================================================================================
- name: Docker Installation
  hosts:
    - ai-web
    - ai-utility
  gather_facts: true
  become: true
  become_method: ansible.builtin.sudo
  become_user: root
  vars_files:
    - ./config-files/config.yaml

  tasks:
    - name: Docker Installation | Include docker installation tasks
      ansible.builtin.import_tasks: tasks/app-docker.yaml

# =============================================================================================================
# Open WebUI Installation - Deploy the Open WebUI application stack on the configured web host.
# =============================================================================================================
- name: Open WebUI Installation
  hosts:
    - ai-web
  gather_facts: true
  become: true
  become_method: ansible.builtin.sudo
  become_user: root
  vars_files:
    - ./config-files/config.yaml

  tasks:
    - name: Open WebUI Installation | Include openweb installation tasks
      ansible.builtin.import_tasks: tasks/app-openweb.yaml

# =============================================================================================================
# Hermes Agent Installation - Deploy the Hermes automation agent on the web host.
# =============================================================================================================
- name: Hermes Agent Installation
  hosts:
    - ai-web
  gather_facts: true
  become: true
  become_method: ansible.builtin.sudo
  become_user: root
  vars_files:
    - ./config-files/config.yaml

  tasks:
    - name: Hermes Agent Installation | Include hermes installation tasks
      ansible.builtin.import_tasks: tasks/app-hermes.yaml

# =============================================================================================================
# Deployment Completion - Log deployment completion timestamp and summary for tracking and auditing.
# =============================================================================================================
- name: Deployment Completion
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Deployment Completion | Log deployment end timestamp
      ansible.builtin.debug:
        msg: "✅ AI Lab Deployment completed at {{ ansible.date_time.iso8601_basic_short }} on {{ ansible.date_time.date }}"
      vars:
        ansible.date_time: "{{ ansible.date_time }}"

    - name: Deployment Completion | Display deployment summary
      ansible.builtin.debug:
        msg: |
          ========================================
          🎉 Deployment Summary
          ========================================
          Completion Time: {{ ansible.date_time.iso8601_basic_short }}
          Date: {{ ansible.date_time.date }}
          
          Deployed Hosts:
            - ai-core (Ollama LLM Runtime)
            - ai-web (Open WebUI + Hermes Agent)
            - ai-utility (Monitoring & Utilities)
          
          Services Deployed:
            ✓ System patches and configuration
            ✓ Ollama LLM runtime engine
            ✓ Open WebUI interface
            ✓ Hermes automation agent
            ✓ Docker and container runtime
          
          Next Steps:
            1. Verify all services are running
            2. Configure authentication (WebUI_AUTH)
            3. Test AI model inference
            4. Review deployment logs: /tmp/ai-lab-deployment-*.log
          ========================================
      vars:
        ansible.date_time: "{{ ansible.date_time }}"
